services:
  desk-tracker:
    build: .
    image: desk-tracker:latest
    container_name: desk-tracker
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: UTC
    ports:
      - "${DESK_TRACKER_PORT:-8080}:8080"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
    # keep the server responsive for everything else it runs
    cpus: "2.0"
    mem_limit: 1g
